<link rel="stylesheet" href="style.css">

<div id="chat">

    <div id="header">
        <div id="title">🤖 Liminal AI 0.4</div>
        <div id="status">🟢 Online</div>
    </div>


    <div id="messages">
        <div class="ai">
            Hello! I'm Liminal AI 0.4.
        </div>
    </div>


    <div id="inputArea">

        <input
            type="text"
            id="userInput"
            placeholder="Ask me anything..."
            autocomplete="off"
        >

        <button id="sendButton" onclick="sendMessage()">
            Send
        </button>

        <button id="clearButton" onclick="clearChat()">
            Clear
        </button>

    </div>

</div>


<script src="script.js"></script>
